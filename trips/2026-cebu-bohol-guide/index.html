 var h='',bar='',k=state.tab;

 var views=k==='sights'?[['list','清單'],['map','地圖'],['calc','包車試算']]:(k==='food'||k==='stay')?[['list','清單'],['map','地圖']]:[];

 if(k==='sights'&&state.view!=='calc'){var g=['全部'].concat(D.sightGroups);if(D.sightGroups.length>1)bar+='<div class="seg">'+g.map(function(x){return '<button data-sg="'+e(x)+'" class="'+(state.sg===x?'on':'')+'">'+e(x)+'</button>'}).join('')+'</div>';bar+=chips('sights')}
 if(k==='food'){var g2=['全部'].concat(D.foodGroups);bar+='<div class="seg">'+g2.map(function(x){return '<button data-g="'+e(x)+'" class="'+(state.food===x?'on':'')+'">'+e(x)+'</button>'}).join('')+'</div>'+chips('food')}
 if(k==='more'){var m=[['emer','🆘 緊急'],['pre','前篇必讀'],['shop','購物與雨備'],['todo','出發前待辦'],['fav','★ 我的收藏'],['about','說明']];bar='<div class="seg">'+m.map(function(x){return '<button data-m="'+x[0]+'" class="'+(state.more===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'}
 var items=curItems();

 else if(k==='food'){var seen={},order=[];items.forEach(function(i){if(!seen[i.group]){seen[i.group]=[];order.push(i.group)}seen[i.group].push(i)});
  if(state.f.near||state.me){h+=items.length?list('food',items,true):''}else order.forEach(function(g){h+=(state.food==='全部'?'<div class="gh">'+e(g)+'</div>':'')+list('food',seen[g],false)});
  if(!items.length)h+='<p class="note">沒有符合篩選的餐廳。</p>'}
 else if(k==='stay'){h+=list('stay',D.stay)}
 else if(k==='move'){h+=list('move',D.move)}
 else{
  if(state.more==='emer'){h+=list('emer',D.emer)+'<p class="note">電話可直接點撥。出事先打 911，再聯絡飯店與駐菲代表處。</p>'}

  else if(state.more==='fav'){var any='';['sights','food','stay','shop'].forEach(function(kk){var fs=D[kk].filter(function(i){return isFav(kk,i)});if(fs.length)any+='<div class="gh">'+{sights:'景點',food:'餐飲',stay:'住宿',shop:'購物與雨備'}[kk]+'</div>'+list(kk,fs)});h+=any||'<p class="note">還沒有收藏。點開任一項，按右上角 ☆ 就能收藏，存在這支手機裡。</p>'}
  else if(state.more==='todo'){h+='<div class="list">'+D.todos.map(function(x){return '<label class="todo"><input type="checkbox" data-k="'+e(x.t)+'"'+(ls('g.t.'+x.t)==='1'?' checked':'')+'><span class="cb"></span><span class="tt"><b><span class="pri '+(x.pri==='高'?'h':'')+'">'+e(x.pri)+'</span>'+t(x.t)+'</b><small>'+t(x.when)+'</small><em>'+t(x.what)+'</em></span></label>'}).join('')+'</div>'}
  else{var src=state.more==='pre'?D.pre:D.about;h+=src.map(function(s){return '<div class="txt">'+(s.title?'<h3>'+t(s.title)+'</h3>':'')+s.paras.map(function(p){return p.li?'<ul><li>'+t(p.t)+'</li></ul>':'<p>'+t(p.t)+'</p>'}).join('')+'</div>'}).join('')}
  if(D.updated)h+='<p class="foot">資料更新日：'+e(D.updated)+'</p>'
 }
 $('#hd').innerHTML='<div class="top"><h1>'+name+'</h1></div>'+vt+'<small>宿霧＋薄荷島通用旅遊指南 R2.7 網頁版'+(D.updated?'・更新 '+e(D.updated):'')+(state.me?'・已用你的位置':'')+'</small>'+bar;
 $('main').innerHTML=h;$('main').scrollTop=0;
 $$('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===state.tab)});
 bind();
 if($('#map'))drawMap(items)}
function bind(){
 $$('.row[data-k]').forEach(function(b){b.onclick=function(){openSheet(b.dataset.k,+b.dataset.i)}});
 $$('[data-g]').forEach(function(b){b.onclick=function(){state.food=b.dataset.g;render()}});
 $$('[data-sg]').forEach(function(b){b.onclick=function(){state.sg=b.dataset.sg;render()}});
 $$('[data-m]').forEach(function(b){b.onclick=function(){state.more=b.dataset.m;render()}});
 $$('[data-v]').forEach(function(b){b.onclick=function(){state.view=b.dataset.v;render()}});
 $$('[data-c]').forEach(function(b){b.onclick=function(){state.f[b.dataset.c]=!state.f[b.dataset.c];render()}});
 $$('[data-me]').forEach(function(b){b.onclick=locate});
 $$('.todo input').forEach(function(c){c.onchange=function(){ls('g.t.'+c.dataset.k,c.checked?'1':'0')}});
 var q=$('details.quick');if(q)q.ontoggle=function(){ls('g.q',q.open?'1':'0')};
 $$('.calc input').forEach(function(c){c.onchange=function(){state.calc[c.value]=c.checked;render()}});
 var st=$('#start');if(st)st.onchange=function(){state.start=st.value;render()}}
// ---- 離我最近
function locate(){if(state.me){state.me=null;render();return}
 if(!navigator.geolocation){alert('這支手機的瀏覽器不支援定位。');return}
 navigator.geolocation.getCurrentPosition(function(p){state.me=[p.coords.latitude,p.coords.longitude];render()},function(){alert('拿不到位置：請允許瀏覽器使用定位，或改用「由近到遠」（以住宿為起點）。')},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
// ---- 地圖（Leaflet，需網路）
var LL=null,mapObj=null;
function loadLeaflet(cb){if(window.L)return cb();if(LL==='loading'){setTimeout(function(){loadLeaflet(cb)},200);return}LL='loading';
 var c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
 var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=function(){LL='ok';cb()};s.onerror=function(){LL=null;var m=$('#map');if(m)m.innerHTML='<p class="note" style="padding:16px">地圖需要網路，現在連不上。清單模式仍可使用。</p>'};document.head.appendChild(s)}
function pinIcon(txt,cls){return L.divIcon({className:'',html:'<div class="pin '+(cls||'')+'"><b>'+txt+'</b></div>',iconSize:[28,28],iconAnchor:[14,28]})}
function drawMap(items){loadLeaflet(function(){var el=$('#map');if(!el)return;if(mapObj){mapObj.remove();mapObj=null}
 mapObj=L.map(el,{zoomControl:true});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapObj);
 var pts=[],k=state.tab;var list=k==='stay'?D.stay:items;
 list.forEach(function(i,n){if(!i.geo)return;pts.push(i.geo);var mk=L.marker(i.geo,{icon:pinIcon(k==='stay'?'住':n+1,k==='stay'?'h':'')}).addTo(mapObj);mk.on('click',function(){openSheet(k,D[k].indexOf(i))})});
 if(k!=='stay'){var ip=pts.slice();D.hotels.forEach(function(h){if(ip.length&&!ip.some(function(p){return km(p,h.geo)<60}))return;pts.push(h.geo);L.marker(h.geo,{icon:pinIcon('住','h')}).addTo(mapObj).bindTooltip(h.title)})}
 if(state.me){pts.push(state.me);L.marker(state.me,{icon:pinIcon('我','me')}).addTo(mapObj)}
 if(state.tab==='food'&&state.food==='全部'&&pts.length){var la=pts.filter(function(p){return p[0]<10});if(la.length)pts=la}
 if(pts.length)mapObj.fitBounds(pts,{padding:[30,30],maxZoom:16});else mapObj.setView([9.9,123.9],9);
 var miss=list.filter(function(i){return !i.geo}).length;if(miss){var n=document.createElement('p');n.className='note';n.style.marginTop='8px';n.textContent='有 '+miss+' 項沒有座標，地圖上不顯示，請看清單。';el.parentNode.appendChild(n)}
 setTimeout(function(){mapObj.invalidateSize()},50)})}
// ---- 包車 8 小時試算
function legMin(a,b){for(var j=0;j<D.legs.length;j++){var l=D.legs[j];if((l[0]===a.title&&l[1]===b.title)||(l[1]===a.title&&l[0]===b.title))return {m:l[2],est:l[3]}}
 if(a.geo&&b.geo)return {m:Math.round(km(a.geo,b.geo)*1.4/38*60+5),est:true};return {m:30,est:true}}
function hm(min){var h=Math.floor(min/60),m=Math.round(min%60);return (h<10?'0':'')+h+':'+(m<10?'0':'')+m}
function calcView(){var C=D.sights.filter(function(i){return i.stay>0&&i.geo});var home=D.stay.filter(function(s){return s.geo&&s.geo[0]<10})[0];
 if(!home)return '<p class="note">沒有住宿座標，無法試算。</p>';
 if(!state.calc){state.calc={};C.forEach(function(i){if(/眼鏡猴|人造森林|巧克力山|Loboc 河/.test(i.title))state.calc[i.title]=true})}
 var sel=C.filter(function(i){return state.calc[i.title]});
 var h='<p class="note">勾選想去的景點，自動排順路、算總時間。起點與終點都是 '+e(home.title)+'。這是推論，出發前請與司機確認。</p>';
 h+='<div class="list calc">'+C.map(function(i){return '<label><input type="checkbox" value="'+e(i.title)+'"'+(state.calc[i.title]?' checked':'')+'><span class="rt"><b>'+t(i.title)+'</b><span>停留約 '+i.stay+' 分'+(i.close?'・'+e(i.close)+' 關':'')+'</span>'+badge(i.status)+'</span></label>'}).join('')+'</div>';
 h+='<p class="note">出發時間 <select id="start" aria-label="出發時間">'+['07:00','07:30','08:00','08:30','09:00','09:30','10:00'].map(function(x){return '<option'+(x===state.start?' selected':'')+'>'+x+'</option>'}).join('')+'</select></p>';
 if(!sel.length)return h+'<p class="note">還沒勾選景點。</p>';
 var st=state.start.split(':');var t0=+st[0]*60+(+st[1]);
 // 試所有順序（最多 7 站），找總時間最短且不超過關門的順序
 function perms(a){if(a.length<2)return [a];var r=[];a.forEach(function(x,i){perms(a.slice(0,i).concat(a.slice(i+1))).forEach(function(p){r.push([x].concat(p))})});return r}
 var best=null;(sel.length<=7?perms(sel):[sel]).forEach(function(p){var now=t0,prev=home,late=0,drv=0;p.forEach(function(s){var l=legMin(prev,s);now+=l.m;drv+=l.m;var c=cnum(s);if(c>0&&now>c*60-15)late++;now+=s.stay;prev=s});var back=legMin(prev,home);now+=back.m;var sc=now-t0+late*600;if(!best||sc<best.sc)best={p:p,sc:sc,total:now-t0,late:late}});
 var now=t0,prev=home,rows='<div class="s"><span class="tm">'+hm(now)+'</span><span>從 '+e(home.title)+' 出發</span></div>',warn=[];
 best.p.forEach(function(s){var l=legMin(prev,s);now+=l.m;var c=cnum(s),cl=c>0?c*60:null;
  if(cl&&now>cl-15)warn.push(clean(s.title)+' 約 '+hm(now)+' 才到，但 '+e(s.close)+' 就關，請換順序或拿掉。');
  rows+='<div class="s"><span class="tm">'+hm(now)+'–'+hm(now+s.stay)+'</span><span><b>'+t(s.title)+'</b><br><span class="dr">車程 '+l.m+' 分'+(l.est?'（估算）':'')+'・停留 '+s.stay+' 分</span></span></div>';now+=s.stay;prev=s});
 var back=legMin(prev,home);now+=back.m;
 rows+='<div class="s"><span class="tm">'+hm(now)+'</span><span>回到 '+e(home.title)+'<br><span class="dr">車程 '+back.m+' 分'+(back.est?'（估算）':'')+'</span></span></div>';
 var tot=now-t0,over=tot>480;
 h+='<div class="sum'+(over?' over':'')+'">總計約 '+Math.floor(tot/60)+' 小時 '+(tot%60)+' 分'+(over?'，超過 8 小時':'，在 8 小時內')+'</div>';
 if(over)h+='<div class="warn">超時要另付費：各業者不同（例如每小時 ₱250–1,000），下單前問清楚。</div>';
 warn.forEach(function(w){h+='<div class="warn">'+w+'</div>'});
 h+='<div class="tl">'+rows+'</div><p class="note">車程用 Google 地圖週六中午的時間；標「估算」的段落是用直線距離推算。跨年假期請每段多留 10–20 分鐘，午餐若不在 Loboc 也要另外留時間。</p>';
 return h}
// ---- 詳情視窗
function fld(l,v){var n=na(v);var x=n?'<span class="na">尚未查到</span>':t(v);if(/電話/.test(l)&&!n&&/\d/.test(v))x='<a class="tel" href="tel:'+e(v.replace(/[^+\d]/g,''))+'">'+e(v)+'</a>';return '<div class="fld"><small>'+e(l)+'</small><div>'+x+'</div></div>'}
var open=false,cur=null;
function openSheet(k,idx){var i=D[k][idx];cur=[k,idx];
 var q=i.geo?i.geo.join(','):encodeURIComponent(clean(i.title).replace(/[（(].*?[）)]/g,'')+' Cebu Bohol');
 var html='';if(i.status)html+='<div style="margin:2px 0 6px">'+badge(i.status)+'</div>';
 if(i.rating)html+=fld('評分（則數）',i.rating);if(i.close)html+=fld('營業到',i.close);

 (i.extra||[]).forEach(function(x){if(x[1]!==undefined&&x[1]!=='')html+=fld(x[0],x[1])});
 html+='<a class="btn" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">在 Google 地圖開啟</a>';
 if(i.geo)html+='<a class="btn ghost" href="https://www.google.com/maps/dir/?api=1&destination='+i.geo.join(',')+'" target="_blank" rel="noopener">導航過去</a>';
 $('#sh-t').innerHTML=t(i.title);$('#sh-b').innerHTML=html;
 var fav=(k!=='move'&&k!=='emer');$('.sv').style.display=fav?'':'none';$('.sv').textContent=isFav(k,i)?'★':'☆';$('.sv').setAttribute('aria-label',isFav(k,i)?'取消收藏':'加入收藏');
