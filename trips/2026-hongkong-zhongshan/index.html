<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="中山旅遊候選資料與出發前核對項目。">
  <title>中山旅遊資訊｜候選與出發前核對</title>
  <style>
    @font-face{font-family:ArchiveTC;src:url('assets/NotoSansCJKtc-Regular.otf')}@font-face{font-family:ArchiveTC;src:url('assets/NotoSansCJKtc-Bold.otf');font-weight:700}
    :root{--ink:#153b37;--ink-soft:#375850;--paper:#f7f0df;--paper-light:#fffdf6;--brick:#8c4035;--line:#9aa89b;--focus:#6f3a31}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.7 ArchiveTC,serif;overflow-x:hidden}a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}a:hover{color:var(--brick)}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
    .masthead{background:var(--ink);color:var(--paper);border-bottom:7px solid var(--brick)}.masthead .wrap{padding:32px 0 30px}.eyebrow{margin:0;color:#f4dab1;font-size:16px;letter-spacing:.08em}.masthead h1{max-width:820px;margin:16px 0 12px;font-size:clamp(2.1rem,5vw,4.4rem);line-height:1.13;letter-spacing:.02em}.subtitle{max-width:720px;margin:0;color:#f7f0df;font-size:20px}.status-banner{border:2px solid #f4dab1;border-left-width:7px;margin-top:24px;padding:13px 16px;max-width:780px}.status-banner strong{display:block;font-size:21px}.status-banner p{margin:4px 0 0;font-size:16px}
    .notice{border-bottom:1px solid var(--line);background:#efe3ca}.notice .wrap{padding:16px 0}.notice p{margin:0;max-width:920px;font-size:16px;color:#263f3a}.tabs-wrap{position:sticky;top:0;z-index:5;background:rgba(247,240,223,.97);border-bottom:1px solid var(--line)}.tabs{width:min(1120px,calc(100% - 32px));margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 0}.tabs button{min-height:50px;border:1.5px solid var(--ink);border-radius:0;background:var(--paper-light);color:var(--ink);font:700 17px ArchiveTC,serif;cursor:pointer}.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
    main{padding:32px 0 72px}.section-head{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:26px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:24px}.section-head h2{font-size:clamp(1.7rem,4vw,2.8rem);line-height:1.2;margin:0}.section-head p{color:var(--ink-soft);font-size:16px;margin:0}.panel[hidden]{display:none}.guide{border:1.5px solid var(--ink);padding:18px;margin:0 0 26px;background:var(--paper-light)}.guide h3{font-size:22px;margin:0 0 7px}.guide p{margin:0}.guide ul{margin:10px 0 0;padding-left:1.35em}.guide li+li{margin-top:7px}
    .background{border-top:5px solid var(--brick);padding:18px 0 0;margin-bottom:28px}.background h3{font-size:24px;margin:0 0 8px}.background p{max-width:900px;margin:0}.source-list{font-size:16px;margin:14px 0 0;padding:0;list-style:none}.source-list li{margin-top:8px}.source-list small{display:block;color:var(--ink-soft)}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--paper-light);border-top:4px solid var(--brick);padding:20px;min-width:0;display:flex;flex-direction:column}.card h3{font-size:23px;line-height:1.35;margin:0 0 12px}.status{align-self:flex-start;display:inline-block;border:1.5px solid var(--ink);background:var(--paper);padding:4px 8px;font-size:16px;font-weight:700;margin:0 0 16px}.fields{margin:0}.fields dt{font-size:16px;font-weight:700;margin-top:16px}.fields dt:first-child{margin-top:0}.fields dd{margin:3px 0 0;font-size:17px}.source-link{display:inline-flex;align-items:center;min-height:44px;margin-top:20px;border:1.5px solid var(--ink);padding:6px 11px;font-weight:700;text-decoration:none;align-self:flex-start}.source-link:hover{background:var(--ink);color:var(--paper)}
    .checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.check-row{background:var(--paper-light);border:1.5px solid var(--ink);display:flex;gap:12px;padding:12px;min-height:66px;align-items:center;cursor:pointer}.check-row input{width:25px;height:25px;flex:0 0 auto;accent-color:var(--ink)}.check-row span{font-size:17px}.storage-note{font-size:16px;color:var(--ink-soft);margin-top:16px}details{margin-top:32px;border-top:2px solid var(--ink);padding-top:16px}summary{cursor:pointer;font-weight:700;font-size:20px}footer{background:var(--ink);color:var(--paper);padding:26px 0;font-size:16px}footer p{margin:0}
    @media(max-width:600px){.wrap,.tabs{width:min(100% - 32px,1120px)}.masthead .wrap{padding:26px 0}.masthead h1{font-size:34px}.subtitle{font-size:18px}.tabs{grid-template-columns:repeat(2,1fr)}.tabs button{min-height:48px;font-size:16px}.section-head{grid-template-columns:1fr;gap:8px;margin-bottom:20px}.section-head h2{font-size:28px}.cards,.checklist{grid-template-columns:1fr}.card{padding:16px}.card h3{font-size:22px}.fields dd{font-size:18px}.guide{padding:16px}.guide h3{font-size:21px}}
  </style>
</head>
<body>
  <header class="masthead"><div class="wrap"><p class="eyebrow">公開資訊整理</p><h1 id="page-title"></h1><p class="subtitle">公開資訊整理；非行程、訂位或即時營運保證。</p><div class="status-banner"><strong>資料狀態：待確認</strong><p>交通、景點、餐飲等會變動的資訊，均須在出發前確認。</p></div></div></header>
  <aside class="notice"><div class="wrap"><p id="intro"></p></div></aside>
  <div class="tabs-wrap"><nav class="tabs" role="tablist" aria-label="資訊分類" id="tabs"></nav></div>
  <main class="wrap"><section class="background" aria-labelledby="background-title"><h3 id="background-title">文化背景｜資料類型</h3><p id="background-text"></p><ul class="source-list" id="background-sources"></ul></section><section id="panel-root"></section></main>
  <footer><div class="wrap"><p>本頁不提供訂票、訂房或付款；會變動的資訊請在出發前確認。</p></div></footer>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
